# Trae cada 15 min los cambios del repo del equipo al repo personal.
# Solo corre en el repo personal; en el repo de la org no hace nada.
name: Sync desde repo del equipo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'jtvaldivia/biforkstrange'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/platanus-hack/platanus-hack-26-cl-team-32.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin HEAD:main
